name: refresh

# Daily: re-read upstream benchmark data and model files, regenerate
# registry/models.json, validate and test it, and commit to main only when
# something changed. A failed fetch keeps the previous entries.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Regenerate registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/mote-refresh -runtime -discover
      - name: Detect changes
        id: diff
        run: |
          git diff --stat
          if git diff --quiet -- registry/; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Validate and test
        if: steps.diff.outputs.changed == 'true'
        run: |
          go vet ./...
          go test ./...
      - name: Smoke-test the pinned runtime
        if: steps.diff.outputs.changed == 'true'
        run: |
          go build -o "$RUNNER_TEMP/mote" ./cmd/mote
          export MOTE_HOME="$RUNNER_TEMP/home" MOTE_CONFIG_DIR="$RUNNER_TEMP/cfg"
          "$RUNNER_TEMP/mote" setup --yes --no-download
          "$RUNNER_TEMP/mote" doctor
      - name: Commit to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          version="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' registry/models.json | head -1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/
          git commit -m "chore: refresh model registry to ${version}"
          git push origin HEAD:main
