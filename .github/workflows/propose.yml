name: propose

# Weekly: look for small Hugging Face models that would change a default
# (the smallest one that clears a profile's benchmark gate) and, when there
# are any, open a pull request that adds them to registry/candidates.json
# with the regenerated registry/models.json. Nothing is merged on its own:
# the quality workflow runs on the branch and a maintainer reviews the draft.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: propose
  cancel-in-progress: false

env:
  BRANCH: propose/models

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Propose candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/mote-refresh -propose "$RUNNER_TEMP/body.md"
      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- registry/; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Validate and test
        if: steps.diff.outputs.changed == 'true'
        run: |
          go vet ./...
          go test ./...
      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add registry/
          git commit -m "feat: propose small models that would change a default"
          # The branch belongs to this job: a newer proposal replaces the old one.
          git push --force origin "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --base main \
              --title "Proposed: small models that would change a default" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
          # Pushes made with GITHUB_TOKEN do not start other workflows, but a
          # dispatch does: run the real-model checks on the proposed registry.
          gh workflow run quality.yml --ref "$BRANCH"
